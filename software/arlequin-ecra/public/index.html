<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Arlequin · ecrã</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<script>
// O modo noite e o brilho antes do primeiro desenho (revisão final M6): o app.js (um módulo) só corre
// depois, e abrir o ecrã de noite mostrava uma fração de segundo com as cores do dia. O mesmo que o
// app.js faz: ?noite=1/?brilho=N ou o guardado (arlequin.noite, arlequin.brilho; 1–5, senão o 2).
(function () {
  var ler = function (k) { try { return JSON.parse(localStorage.getItem(k)) } catch (e) { return null } }
  try {
    var q = new URLSearchParams(location.search)
    var noite = q.has('noite') ? q.get('noite') === '1' : ler('arlequin.noite') === true
    var b = Number(q.has('brilho') ? q.get('brilho') : ler('arlequin.brilho'))
    document.body.classList.toggle('noite', noite)
    document.body.dataset.brilho = String(Number.isInteger(b) && b >= 1 && b <= 5 ? b : 2)
  } catch (e) { /* fica o dia: o app.js acerta a seguir */ }
})()
</script>
<div id="app">
  <header id="barra"></header>
  <main id="pagina"></main>
  <nav id="botoes">
    <button data-pag="carta">Carta</button>
    <button data-pag="instr">Instr.</button>
    <button data-pag="ais">AIS</button>
    <button data-pag="motor">Motor</button>
    <button data-pag="viagem">Viagem</button>
    <button data-pag="diario">Diário</button>
    <button data-pag="melhor" class="rt">Melhor rota</button>
    <button data-pag="velas" class="vel">Velas</button>
    <button data-acao="noite" id="b-noite">Noite</button>
    <button data-acao="brilho-menos" id="b-brilho-menos" class="brilho" aria-label="Menos brilho (noite)" title="Menos brilho">−</button>
    <button data-acao="brilho-mais" id="b-brilho-mais" class="brilho" aria-label="Mais brilho (noite)" title="Mais brilho">+</button>
  </nav>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
