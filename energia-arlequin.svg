<path d="M640 492 L658 492 L658 290 L502 290" fill="none" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</g>

<line x1="4" y1="572" x2="676" y2="572" stroke="#bbb" stroke-width="0.8"/>
<text class="th" x="24" y="596">Balanço (estimativa, §5c do NAVEGACAO.md)</text>
<text class="ts" x="24" y="616">Porto e navegar sem piloto: autónomo o ano todo · Com o EV-100: da primavera ao outono</text>
