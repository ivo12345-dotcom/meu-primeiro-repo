name: Rodado — build do APK

on:
  push:
    paths:
      - 'rodado/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rodado

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo (matemática e importações)
        run: ./gradlew --no-daemon :core:test

      - name: Compilar o APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rodado-apk
          path: rodado/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar o relatório dos testes se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: rodado/core/build/reports/tests/test
          if-no-files-found: ignore
