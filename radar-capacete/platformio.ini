; Radar de capacete para airsoft
; Placa: Heltec WiFi LoRa 32 V3 (ESP32-S3)

[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1

; Versão de bancada: só 1 radar, e a porta USB fica livre para mensagens no PC.
;   pio run -e bancada -t upload   e depois   pio device monitor
[env:bancada]
extends = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -DNUM_RADARS=1
